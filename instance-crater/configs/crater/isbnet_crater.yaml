model:
  in_feat: 66
  hid_feat: 32
  num_layers: 4
  numclass: 2
  num_points: 81920    # Number of input points
  sub_grid_size : 0.06  # preprocess_parameter
  train_steps: 500  # Number of steps per epochs
  val_steps: 100  # Number of validation steps per epoch
  d_out : [16, 64, 128, 256]  # feature dimension
  rep_d_out : [16, 64, 128, 256]  # feature dimension
  noise_init: 3.5  # noise initial parameter

  channels: 32
  num_blocks: 7
  semantic_classes: 2
  instance_classes: 1
  sem2ins_classes: []
  semantic_only: False
  with_coords: True
  ignore_label: -100
  voxel_scale: 3
  use_spp_pool: False
  filter_bg_thresh: 0.2
  iterative_sampling: False
  mask_dim_out: 32
  instance_head_cfg:
    num_dyco_layer: 2
    dec_dim: 64
    n_sample_pa1: 4096
    n_queries: 256
    radius_scale: 4
    radius: 0.4
    neighbor: 64
  test_cfg:
    x4_split: False
    logit_thresh: 0.0
    score_thresh: 0.2
    npoint_thresh: 10
    type_nms: 'standard'
    topk: 100
    nms_threshold: 0.2

  #fixed_modules: ['backbone', 'semantic_linear', 'offset_linear', 'offset_vertices_linear', 'box_conf_linear']
  fixed_modules: ['backbone', 'semantic_linear']

data:
  train:
    type: 'crater'
    data_root: ''
    prefix: ['train']
    suffix: '_inst_nostuff.pth'
    training: True
    repeat: 1
    num_layers: 4
    sub_grid_size : 0.06  # preprocess_parameter
    k_n : 32  # KNN
    sub_sampling_ratio: [4, 4, 4, 4]
    voxel_cfg:
      scale: 3
      spatial_shape: [128, 512]
      max_npoint: 250000
      min_npoint: 5000
  test:
    type: 'crater'
    data_root: ''
    prefix: ['test']
    suffix: '_inst_nostuff.pth'
    training: False
    num_layers: 4
    sub_grid_size : 0.06  # preprocess_parameter
    k_n : 32  # KNN
    sub_sampling_ratio: [4, 4, 4, 4]
    voxel_cfg:
      scale: 3
      spatial_shape: [128, 512]
      max_npoint: 250000
      min_npoint: 5000


dataloader:
  train:
    batch_size: 8
    num_workers: 6
  test:
    batch_size: 1
    num_workers: 1

optimizer:
  type: 'AdamW'
  lr: 0.02
  weight_decay: 0.0001

save_cfg:
  semantic: False
  instance: True
  nmc_clusters: False

fp16: True
epochs: 200
step_epoch: 50
save_freq: 3
pretrain: ''
work_dir: ''
